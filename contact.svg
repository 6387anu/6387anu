<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-label="Open to software development roles. Let's build something together." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#151B2E"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF3B52" stop-opacity="0"/><stop offset=".5" stop-color="#FF8A8A"/><stop offset="1" stop-color="#FF3B52" stop-opacity="0"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF3B52"/><stop offset="1" stop-color="#FF9A8B"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#FF3B52" stop-opacity=".45"/><stop offset="1" stop-color="#FF3B52" stop-opacity="0"/></radialGradient><radialGradient id="glow2"><stop offset="0" stop-color="#FF5A6E" stop-opacity=".22"/><stop offset="1" stop-color="#FF5A6E" stop-opacity="0"/></radialGradient>
<clipPath id="cc"><rect x="1" y="1" width="958" height="198" rx="20"/></clipPath>
</defs>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.eb{font-size:13px;font-weight:600;letter-spacing:.6px;fill:#34D399}
.hd{font-size:32px;font-weight:700;fill:#F0F4FF;letter-spacing:-.8px}
.sub{font-size:15px;fill:#94A3C4}
@keyframes sweep{to{stroke-dashoffset:-2000}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes ring{0%{r:34;opacity:.6}100%{r:84;opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-14px)}}
.g1{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
.g2{animation:drift 10s ease-in-out infinite}
.border{stroke-dasharray:280 1720;animation:sweep 8s linear infinite}
.a1{opacity:0;animation:rise .8s .1s ease-out forwards}.a2{opacity:0;animation:rise .8s .35s ease-out forwards}
.ring{fill:none;stroke:#FF5A6E;stroke-width:1.5;animation:ring 3.2s ease-out infinite}
.env{transform-box:fill-box;transform-origin:center;animation:float 4s ease-in-out infinite}
.flap{transform-box:fill-box;transform-origin:top center;animation:flap 4s ease-in-out infinite}
.dot{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.a1,.a2{opacity:1}}
</style>
<rect x="1" y="1" width="958" height="198" rx="20" fill="url(#bg)" stroke="#262F4A"/>
<g clip-path="url(#cc)"><circle class="g1" cx="800" cy="100" r="230" fill="url(#glow)"/><circle class="g2" cx="60" cy="210" r="240" fill="url(#glow2)"/></g>
<rect class="border" x="1" y="1" width="958" height="198" rx="20" fill="none" stroke="url(#beam)" stroke-width="2" pathLength="2000"/>
<g class="a1"><circle class="dot" cx="54" cy="52" r="4.5" fill="#34D399"/><text class="eb" x="68" y="57">OPEN TO OPPORTUNITIES</text>
<text class="hd" x="48" y="106">Let's build something together.</text></g>
<g class="a2"><text class="sub" x="48" y="140">Looking for software development roles. I'm happy to talk about</text><text class="sub" x="48" y="162">full-stack, ML and AI projects.</text></g>
<circle class="ring" cx="800" cy="100"/><circle class="ring" cx="800" cy="100" style="animation-delay:1.6s"/>
<g class="env"><rect x="760" y="72" width="80" height="56" rx="9" fill="#1A2240" stroke="url(#line)" stroke-width="2.5"/>
<path class="flap" d="M763 77 L800 107 L837 77" fill="none" stroke="#FF8A8A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>