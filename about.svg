<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="About Anurag Yadav" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#151B2E"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:24px;font-weight:700;fill:#F0F4FF}
.p{font-size:15px;fill:#B6C2DE}
.k{font-size:13.5px;fill:#8EA0BD}
.v{font-size:15px;font-weight:600;fill:#E6EDF7}
.step{font-size:12.5px;fill:#CBD5F0}
.cap{font-size:12px;fill:#8EA0BD}
@keyframes rise{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes sweep{to{stroke-dashoffset:-2000}}
@keyframes grow{from{stroke-dashoffset:820}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes ping{0%{r:7;opacity:.7}100%{r:20;opacity:0}}
@keyframes under{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.border{stroke-dasharray:260 1740;animation:sweep 8s linear infinite}
.fact{opacity:0;animation:rise .7s ease-out forwards}
.node{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out forwards}
.track{stroke-dasharray:820;animation:grow 1.8s 1.4s ease-out both}
.ul{transform-origin:48px 0;animation:under .8s .1s ease-out both}
.ping{fill:none;stroke:#22D3EE;stroke-width:1.5;animation:ping 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fact,.node{opacity:1}}
</style>
<rect x="1" y="1" width="958" height="328" rx="20" fill="url(#bg)" stroke="#262F4A"/>
<rect class="border" x="1" y="1" width="958" height="328" rx="20" fill="none" stroke="url(#beam)" stroke-width="2" pathLength="2000"/>
<text class="h" x="48" y="50">About me</text>
<rect class="ul" x="48" y="60" width="56" height="3" rx="1.5" fill="url(#line)"/>
<text class="p" x="48" y="92">I learn by shipping. My work spans full-stack web apps, machine learning</text>
<text class="p" x="48" y="112" opacity="1">with explainability, and security.</text>
<g class="fact" style="animation-delay:0.4s"><rect x="48" y="112" width="4" height="22" rx="2" fill="#7C5CFF"/><text class="k" x="64" y="128">Studying</text><text class="v" x="190" y="128">B.Tech, Computer Science Engineering</text></g><g class="fact" style="animation-delay:0.65s"><rect x="48" y="146" width="4" height="22" rx="2" fill="#22D3EE"/><text class="k" x="64" y="162">Building</text><text class="v" x="190" y="162">Full-stack apps and ML-based security tools</text></g><g class="fact" style="animation-delay:0.9s"><rect x="48" y="180" width="4" height="22" rx="2" fill="#F5B84B"/><text class="k" x="64" y="196">Strengthening</text><text class="v" x="190" y="196">Java, DSA, React, Node.js, Machine Learning</text></g><g class="fact" style="animation-delay:1.15s"><rect x="48" y="214" width="4" height="22" rx="2" fill="#34D399"/><text class="k" x="64" y="230">Looking for</text><text class="v" x="190" y="230">Software development opportunities</text></g>
<text class="cap" x="48" y="238">Learning path</text>
<line x1="110" y1="268" x2="850" y2="268" stroke="#262F4A" stroke-width="2"/>
<line class="track" x1="110" y1="268" x2="850" y2="268" stroke="url(#line)" stroke-width="2.5" pathLength="820"/>
<g class="node" style="animation-delay:1.6s"><circle cx="110" cy="268" r="7" fill="#0D1117" stroke="#7C5CFF" stroke-width="2"/><circle cx="110" cy="268" r="3" fill="#22D3EE"/><text class="step" x="110" y="298" text-anchor="middle">DSA &amp; Problem Solving</text></g><g class="node" style="animation-delay:1.85s"><circle cx="290" cy="268" r="7" fill="#0D1117" stroke="#7C5CFF" stroke-width="2"/><circle cx="290" cy="268" r="3" fill="#22D3EE"/><text class="step" x="290" y="298" text-anchor="middle">Java</text></g><g class="node" style="animation-delay:2.1s"><circle cx="480" cy="268" r="7" fill="#0D1117" stroke="#7C5CFF" stroke-width="2"/><circle cx="480" cy="268" r="3" fill="#22D3EE"/><text class="step" x="480" y="298" text-anchor="middle">Full-Stack</text></g><g class="node" style="animation-delay:2.35s"><circle cx="670" cy="268" r="7" fill="#0D1117" stroke="#7C5CFF" stroke-width="2"/><circle cx="670" cy="268" r="3" fill="#22D3EE"/><text class="step" x="670" y="298" text-anchor="middle">Machine Learning</text></g><g class="node" style="animation-delay:2.6s"><circle cx="850" cy="268" r="7" fill="#0D1117" stroke="#7C5CFF" stroke-width="2"/><circle cx="850" cy="268" r="3" fill="#22D3EE"/><text class="step" x="850" y="298" text-anchor="middle">Cybersecurity</text></g>
<circle class="ping" cx="110" cy="268" r="7"><animate attributeName="cx" values="110;290;480;670;850;110" dur="10s" begin="2.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.2;.4;.6;.8;1"/></circle>
<circle r="5" cy="268" fill="#F5B84B"><animate attributeName="cx" values="110;850" dur="5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="5s" begin="2.5s" repeatCount="indefinite"/></circle>
</svg>