<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="About: B.Tech CSE student working across full-stack development, machine learning and AI applications" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#141B2F"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><radialGradient id="hg"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".4"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient></defs>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.eyebrow{font-size:13px;fill:#94A3C4}
.hd{font-size:29px;font-weight:700;fill:#F0F4FF;letter-spacing:-.6px}
.p{font-size:15px;fill:#B6C2DE}
.nt{font-size:16px;font-weight:700;fill:#F0F4FF}
.ns{font-size:12.5px;fill:#94A3C4}
.pill{font-size:13px;fill:#E6EDF7}
.hub{font-size:19px;font-weight:700;fill:#F0F4FF}
@keyframes sweep{to{stroke-dashoffset:-2000}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ring{0%{r:36;opacity:.6}100%{r:66;opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes under{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.border{stroke-dasharray:260 1740;animation:sweep 8s linear infinite}
.a1{opacity:0;animation:rise .8s .1s ease-out forwards}.a2{opacity:0;animation:rise .8s .35s ease-out forwards}.a3{opacity:0;animation:rise .8s .6s ease-out forwards}
.node{opacity:0;animation:slide .7s ease-out forwards}
.wire{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards}
.ring{fill:none;stroke:#7C5CFF;stroke-width:1.5;animation:ring 3s ease-out infinite}
.blink{animation:blink 2s ease-in-out infinite}
.ul{transform-origin:48px 0;animation:under .8s .2s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.a1,.a2,.a3,.node{opacity:1}.wire{stroke-dashoffset:0}}
</style>
<rect x="1" y="1" width="958" height="338" rx="20" fill="url(#bg)" stroke="#262F4A"/>
<circle cx="520" cy="170" r="150" fill="url(#hg)"/>
<rect class="border" x="1" y="1" width="958" height="338" rx="20" fill="none" stroke="url(#beam)" stroke-width="2" pathLength="2000"/>
<g class="a1"><text class="eyebrow" x="48" y="56">About</text><rect class="ul" x="48" y="66" width="40" height="3" rx="1.5" fill="url(#line)"/>
<text class="hd" x="48" y="112">Building across the stack,</text><text class="hd" x="48" y="148">from interface to model.</text></g>
<g class="a2"><text class="p" x="48" y="190">B.Tech CSE student working on full-stack web</text><text class="p" x="48" y="212">applications, and applying machine learning and AI</text><text class="p" x="48" y="234">to practical problems, including security.</text></g>
<g class="a3"><rect x="48" y="262" width="288" height="34" rx="17" fill="#161D33" stroke="#2E3A63"/><circle class="blink" cx="70" cy="279" r="5" fill="#34D399"/><text class="pill" x="86" y="284">Open to software development roles</text></g>
<path id="p0" class="wire" d="M556,170 C600,170 610,78 640,78" fill="none" stroke="#7C5CFF" stroke-opacity=".55" stroke-width="2" pathLength="1" style="animation-delay:0.6s"/><circle r="4.5" fill="#7C5CFF" opacity="0"><animateMotion dur="2.6s" begin="2.2s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.6s" begin="2.2s" repeatCount="indefinite"/></circle><path id="p1" class="wire" d="M556,170 C600,170 610,170 640,170" fill="none" stroke="#22D3EE" stroke-opacity=".55" stroke-width="2" pathLength="1" style="animation-delay:0.85s"/><circle r="4.5" fill="#22D3EE" opacity="0"><animateMotion dur="2.6s" begin="2.9000000000000004s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.6s" begin="2.9000000000000004s" repeatCount="indefinite"/></circle><path id="p2" class="wire" d="M556,170 C600,170 610,262 640,262" fill="none" stroke="#F5B84B" stroke-opacity=".55" stroke-width="2" pathLength="1" style="animation-delay:1.1s"/><circle r="4.5" fill="#F5B84B" opacity="0"><animateMotion dur="2.6s" begin="3.6s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.6s" begin="3.6s" repeatCount="indefinite"/></circle>
<circle class="ring" cx="520" cy="170"/><circle class="ring" cx="520" cy="170" style="animation-delay:1.5s"/>
<circle cx="520" cy="170" r="36" fill="#1A2240" stroke="url(#line)" stroke-width="2.5"/>
<text class="hub" x="520" y="177" text-anchor="middle">AY</text>
<g class="node" style="animation-delay:0.9s"><rect x="640" y="42" width="272" height="72" rx="14" fill="#161D33" stroke="#2E3A63"/><rect x="640" y="42" width="5" height="72" rx="2.5" fill="#7C5CFF"/><circle class="blink" cx="890" cy="62" r="4" fill="#7C5CFF" style="animation-delay:0.0s"/><text class="nt" x="662" y="72">Full-Stack</text><text class="ns" x="662" y="94">MongoDB · Express · React · Node.js</text></g><g class="node" style="animation-delay:1.15s"><rect x="640" y="134" width="272" height="72" rx="14" fill="#161D33" stroke="#2E3A63"/><rect x="640" y="134" width="5" height="72" rx="2.5" fill="#22D3EE"/><circle class="blink" cx="890" cy="154" r="4" fill="#22D3EE" style="animation-delay:0.5s"/><text class="nt" x="662" y="164">Machine Learning</text><text class="ns" x="662" y="186">Python · XGBoost · SHAP · Scikit-learn</text></g><g class="node" style="animation-delay:1.4s"><rect x="640" y="226" width="272" height="72" rx="14" fill="#161D33" stroke="#2E3A63"/><rect x="640" y="226" width="5" height="72" rx="2.5" fill="#F5B84B"/><circle class="blink" cx="890" cy="246" r="4" fill="#F5B84B" style="animation-delay:1.0s"/><text class="nt" x="662" y="256">AI Applications</text><text class="ns" x="662" y="278">Python · FastAPI · Gemini API</text></g>
</svg>
