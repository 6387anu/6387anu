<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="SQL Injection Detection project: a machine learning detector using TF-IDF, XGBoost and SHAP explanations" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#151B2E"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#22D3EE" stop-opacity=".28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<clipPath id="cc"><rect x="1" y="1" width="958" height="298" rx="20"/></clipPath>
<clipPath id="win"><rect x="520" y="40" width="400" height="220" rx="14"/></clipPath>
</defs>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.6px}
.title{font-size:38px;font-weight:700;fill:#F0F4FF;letter-spacing:-1px}
.desc{font-size:15px;fill:#B6C2DE}
.tag{font-size:12.5px;fill:#CBD5F0}
.bt{font-size:13px;font-weight:600}
.m{font-size:11px;fill:#8EA0BD}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes sweep{to{stroke-dashoffset:-2000}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes under{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,12px)}}
.border{stroke-dasharray:300 1700;animation:sweep 8s linear infinite}
.l1{opacity:0;animation:rise .8s .1s ease-out forwards}.l2{opacity:0;animation:rise .8s .35s ease-out forwards}
.chip{opacity:0;animation:rise .5s ease-out forwards}
.ul{transform-origin:48px 0;animation:under .7s .2s ease-out both}
.gl{animation:drift 9s ease-in-out infinite}
.win{opacity:0;animation:rise .9s .3s ease-out forwards}
@keyframes typ{0%,6%{transform:scaleX(1)}30%,94%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes press{0%,31%{transform:scale(1)}33%{transform:scale(.94)}36%,100%{transform:scale(1)}}
@keyframes verdict{0%,36%{opacity:0;transform:scale(.8)}41%,94%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8)}}
@keyframes b1{0%,40%{transform:scaleX(0)}50%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes b2{0%,43%{transform:scaleX(0)}53%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes b3{0%,46%{transform:scaleX(0)}56%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.cover{transform-box:fill-box;transform-origin:right center;animation:typ 10s steps(21,end) infinite}
.btn{transform-box:fill-box;transform-origin:center;animation:press 10s ease-in-out infinite}
.vd{transform-box:fill-box;transform-origin:center;opacity:0;animation:verdict 10s ease-out infinite}
.sb{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.sb1{animation:b1 10s ease-out infinite}.sb2{animation:b2 10s ease-out infinite}.sb3{animation:b3 10s ease-out infinite}
.caret{animation:blink 1s step-end infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.l1,.l2,.chip,.win{opacity:1}}
</style>
<rect x="1" y="1" width="958" height="298" rx="20" fill="url(#bg)" stroke="#262F4A"/>
<g clip-path="url(#cc)"><circle class="gl" cx="760" cy="60" r="260" fill="url(#glow)"/></g>
<rect class="border" x="1" y="1" width="958" height="298" rx="20" fill="none" stroke="url(#beam)" stroke-width="2" pathLength="2000"/>
<g class="l1"><text class="eyebrow" x="48" y="58" fill="#22D3EE">MACHINE LEARNING · SECURITY</text><rect class="ul" x="48" y="68" width="36" height="3" rx="1.5" fill="#22D3EE"/><text class="title" x="48" y="112">SQL Injection Detection</text></g><g class="l2"><text class="desc" x="48" y="138">Detects SQL injection with character-level</text><text class="desc" x="48" y="160">TF-IDF and XGBoost, then uses SHAP to</text><text class="desc" x="48" y="182">explain why a query was flagged.</text></g><g class="chip" style="animation-delay:0.6s"><rect x="48" y="212" width="71" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><circle cx="61" cy="225" r="3" fill="#22D3EE"/><text class="tag" x="70" y="229.5">Python</text></g><g class="chip" style="animation-delay:0.7s"><rect x="127" y="212" width="78" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><circle cx="140" cy="225" r="3" fill="#22D3EE"/><text class="tag" x="149" y="229.5">XGBoost</text></g><g class="chip" style="animation-delay:0.8s"><rect x="213" y="212" width="57" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><circle cx="226" cy="225" r="3" fill="#22D3EE"/><text class="tag" x="235" y="229.5">SHAP</text></g><g class="chip" style="animation-delay:0.9s"><rect x="278" y="212" width="112" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><circle cx="291" cy="225" r="3" fill="#22D3EE"/><text class="tag" x="300" y="229.5">Scikit-learn</text></g><g class="chip" style="animation-delay:1.0s"><rect x="398" y="212" width="92" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><circle cx="411" cy="225" r="3" fill="#22D3EE"/><text class="tag" x="420" y="229.5">Streamlit</text></g><g class="l2"><rect x="48" y="254" width="100" height="30" rx="15" fill="#22D3EE"/><text class="bt" x="98.0" y="273.5" text-anchor="middle" fill="#0D1117">Live demo</text><rect x="158" y="254" width="115" height="30" rx="15" fill="none" stroke="#3A4673"/><text class="bt" x="215.5" y="273.5" text-anchor="middle" fill="#CBD5F0">Source code</text></g><g class="win"><rect x="520" y="40" width="400" height="220" rx="14" fill="#0F1424" stroke="#2E3A63"/>
<path d="M520 54a14 14 0 0 1 14-14h372a14 14 0 0 1 14 14v14H520z" fill="#1A2240"/><line x1="520" y1="68" x2="920" y2="68" stroke="#2E3A63"/>
<circle cx="538" cy="54" r="4" fill="#FF5F57"/><circle cx="552" cy="54" r="4" fill="#FEBC2E"/><circle cx="566" cy="54" r="4" fill="#28C840"/>
<rect x="590" y="46" width="236" height="16" rx="8" fill="#0F1424"/><text class="m" x="708" y="57.5" text-anchor="middle">sql-detection.streamlit.app</text>
<g clip-path="url(#win)"><rect x="520" y="69" width="400" height="190" fill="#0F1424"/>
<text x="544" y="92" style="font-size:14px;font-weight:700;fill:#F0F4FF">SQL Injection Detector</text>
<text class="m" x="544" y="108">Enter a query</text>
<rect x="544" y="114" width="352" height="30" rx="7" fill="#161D33" stroke="#2E3A63"/>
<text class="mono" x="554" y="133" style="font-size:12.5px;fill:#E6EDF7">admin' OR '1'='1' --</text>
<rect class="cover" x="550" y="118" width="338" height="22" fill="#161D33"/>
<rect class="caret" x="706.0" y="120" width="1.5" height="18" fill="#22D3EE"/>
<g class="btn"><rect x="544" y="154" width="86" height="26" rx="7" fill="#FF4B4B"/><text x="587" y="171.5" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#fff">Analyze</text></g>
<g class="vd"><rect x="644" y="154" width="112" height="26" rx="13" fill="#FF4B4B" fill-opacity=".15" stroke="#FF4B4B"/><circle cx="660" cy="167" r="4" fill="#FF4B4B"/><text x="672" y="171.5" style="font-size:12px;font-weight:700;fill:#FF4B4B">Malicious</text></g>
<text class="m" x="544" y="199" style="letter-spacing:.4px">SHAP · TOP CONTRIBUTING TOKENS</text>
<text class="m mono" x="544" y="216">' OR</text><rect x="600" y="209" width="150" height="8" rx="4" class="sb sb1" fill="#FF4B4B"/><text class="m mono" x="544" y="232">1'='1</text><rect x="600" y="225" width="118" height="8" rx="4" class="sb sb2" fill="#FF4B4B"/><text class="m mono" x="544" y="248">--</text><rect x="600" y="241" width="84" height="8" rx="4" class="sb sb3" fill="#F5B84B"/>
</g></g>
</svg>
