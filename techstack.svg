.chipw{opacity:0;animation:rise .6s ease-out forwards}
.chip{animation:bob 4.5s ease-in-out infinite}
.lab{opacity:0;animation:rise .6s ease-out forwards}
.ul{transform-origin:48px 0;animation:under .8s .1s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.chipw,.lab{opacity:1}}
</style>
