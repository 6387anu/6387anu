<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" role="img" aria-label="WanderLust" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#151B2E"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/><stop offset=".5" stop-color="#7C5CFF"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".28"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
    <clipPath id="cc"><rect x="1" y="1" width="438" height="208" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
    .title { font-size:20px; font-weight:700; fill:#F0F4FF; letter-spacing:-.3px; }
    .cat { font-size:12px; fill:#94A3C4; }
    .desc { font-size:13.5px; fill:#B6C2DE; }
    .tag { font-size:12px; fill:#CBD5F0; }
    @keyframes sweep { to { stroke-dashoffset:-1000; } }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-14px,10px)} }
    .border { stroke-dasharray:140 860; animation:sweep 6s linear infinite; }
    .icon { animation:float 4s ease-in-out infinite; }
    .glow { animation:drift 8s ease-in-out infinite; }
    .chip { opacity:0; animation:rise .6s ease-out forwards; }
    .head { animation:rise .7s ease-out both; }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; } .chip { opacity:1; } }
  </style>
  <rect x="1" y="1" width="438" height="208" rx="16" fill="url(#bg)" stroke="#262F4A"/>
  <g clip-path="url(#cc)"><circle class="glow" cx="390" cy="30" r="110" fill="url(#glow)"/></g>
  <rect class="border" x="1" y="1" width="438" height="208" rx="16" fill="none" stroke="url(#beam)" stroke-width="2" pathLength="1000"/>
  <g class="head">
    <rect x="28" y="26" width="44" height="44" rx="12" fill="#1A2240" stroke="#2E3A63"/>
    <g class="icon" transform="translate(50 48)"><g><path d="M0,-11 L12,-1 H8 V10 H-8 V-1 H-12 Z" fill="none" stroke="#7C5CFF" stroke-width="2" stroke-linejoin="round"/></g></g>
    <text class="title" x="84" y="45">WanderLust</text>
    <text class="cat" x="84" y="64">Full-stack web</text>
  </g>
  <text class="desc" x="28" y="100">Airbnb-inspired full-stack app with listings,</text><text class="desc" x="28" y="121">image uploads and interactive maps.</text>
  <g class="chip" style="animation-delay:0.5s"><rect x="28" y="160" width="73" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><text class="tag" x="64.5" y="177" text-anchor="middle">Node.js</text></g><g class="chip" style="animation-delay:0.65s"><rect x="109" y="160" width="73" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><text class="tag" x="145.5" y="177" text-anchor="middle">Express</text></g><g class="chip" style="animation-delay:0.8s"><rect x="190" y="160" width="73" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><text class="tag" x="226.5" y="177" text-anchor="middle">MongoDB</text></g><g class="chip" style="animation-delay:0.95s"><rect x="271" y="160" width="66" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><text class="tag" x="304.0" y="177" text-anchor="middle">Mapbox</text></g>
</svg>