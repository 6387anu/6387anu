<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="WanderLust project: an Airbnb-inspired full-stack listings app built with Node.js, Express, MongoDB and Mapbox" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#151B2E"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF5A6E" stop-opacity="0"/><stop offset=".5" stop-color="#FF5A6E"/><stop offset="1" stop-color="#FF5A6E" stop-opacity="0"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#FF5A6E" stop-opacity=".28"/><stop offset="1" stop-color="#FF5A6E" stop-opacity="0"/></radialGradient>
<clipPath id="cc"><rect x="1" y="1" width="958" height="298" rx="20"/></clipPath>
<clipPath id="win"><rect x="520" y="40" width="400" height="220" rx="14"/></clipPath>
</defs>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.6px}
.title{font-size:38px;font-weight:700;fill:#F0F4FF;letter-spacing:-1px}
.desc{font-size:15px;fill:#B6C2DE}
.tag{font-size:12.5px;fill:#CBD5F0}
.bt{font-size:13px;font-weight:600}
.m{font-size:11px;fill:#8EA0BD}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes sweep{to{stroke-dashoffset:-2000}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes under{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,12px)}}
.border{stroke-dasharray:300 1700;animation:sweep 8s linear infinite}
.l1{opacity:0;animation:rise .8s .1s ease-out forwards}.l2{opacity:0;animation:rise .8s .35s ease-out forwards}
.chip{opacity:0;animation:rise .5s ease-out forwards}
.ul{transform-origin:48px 0;animation:under .7s .2s ease-out both}
.gl{animation:drift 9s ease-in-out infinite}
.win{opacity:0;animation:rise .9s .3s ease-out forwards}
@keyframes cur{0%,8%{transform:translate(0,0)}30%,60%{transform:translate(-52px,-62px)}85%,100%{transform:translate(0,0)}}
@keyframes ring{0%,28%{opacity:0}34%,58%{opacity:1}64%,100%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.cur{animation:cur 8s ease-in-out infinite}.hl{opacity:0;animation:ring 8s ease-in-out infinite}.pin{animation:bob 2.4s ease-in-out infinite}
.lc{opacity:0;animation:rise .6s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.l1,.l2,.chip,.win{opacity:1}}
</style>
<rect x="1" y="1" width="958" height="298" rx="20" fill="url(#bg)" stroke="#262F4A"/>
<g clip-path="url(#cc)"><circle class="gl" cx="760" cy="60" r="260" fill="url(#glow)"/></g>
<rect class="border" x="1" y="1" width="958" height="298" rx="20" fill="none" stroke="url(#beam)" stroke-width="2" pathLength="2000"/>
<defs><linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FF5A6E"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5B84B"/><stop offset="1" stop-color="#FF5A6E"/></linearGradient></defs><g class="l1"><text class="eyebrow" x="48" y="58" fill="#FF5A6E">FULL-STACK WEB · LIVE</text><rect class="ul" x="48" y="68" width="36" height="3" rx="1.5" fill="#FF5A6E"/><text class="title" x="48" y="112">WanderLust</text></g><g class="l2"><text class="desc" x="48" y="138">An Airbnb-inspired app for browsing and</text><text class="desc" x="48" y="160">managing listings, with image uploads and</text><text class="desc" x="48" y="182">interactive maps.</text></g><g class="chip" style="animation-delay:0.6s"><rect x="48" y="212" width="78" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><circle cx="61" cy="225" r="3" fill="#FF5A6E"/><text class="tag" x="70" y="229.5">Node.js</text></g><g class="chip" style="animation-delay:0.7s"><rect x="134" y="212" width="78" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><circle cx="147" cy="225" r="3" fill="#FF5A6E"/><text class="tag" x="156" y="229.5">Express</text></g><g class="chip" style="animation-delay:0.8s"><rect x="220" y="212" width="78" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><circle cx="233" cy="225" r="3" fill="#FF5A6E"/><text class="tag" x="242" y="229.5">MongoDB</text></g><g class="chip" style="animation-delay:0.9s"><rect x="306" y="212" width="71" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><circle cx="319" cy="225" r="3" fill="#FF5A6E"/><text class="tag" x="328" y="229.5">Mapbox</text></g><g class="chip" style="animation-delay:1.0s"><rect x="385" y="212" width="99" height="26" rx="13" fill="#1A2240" stroke="#2E3A63"/><circle cx="398" cy="225" r="3" fill="#FF5A6E"/><text class="tag" x="407" y="229.5">Cloudinary</text></g><g class="l2"><rect x="48" y="254" width="100" height="30" rx="15" fill="#FF5A6E"/><text class="bt" x="98.0" y="273.5" text-anchor="middle" fill="#0D1117">Live demo</text><rect x="158" y="254" width="115" height="30" rx="15" fill="none" stroke="#3A4673"/><text class="bt" x="215.5" y="273.5" text-anchor="middle" fill="#CBD5F0">Source code</text></g><g class="win"><rect x="520" y="40" width="400" height="220" rx="14" fill="#0F1424" stroke="#2E3A63"/>
